/* Refinements: comfortable photo crop controls and stay date picker */
.photo-upload .photo-queue-card{align-items:start;grid-template-columns:minmax(220px,.85fr) minmax(320px,1.15fr);gap:24px;padding:20px;background:#fffdfa;border-color:#173b3d18;box-shadow:0 10px 30px #173b3d08}

  aside{z-index:120;top:65px;width:min(280px,86vw);max-width:86vw;padding:22px 14px;overflow-y:auto;overflow-x:hidden}
  .admin-brand{padding:3px 6px 24px}
  .site-link{margin:0 4px 18px}
  aside nav{width:100%;min-width:0}

  .view-head{width:100%;min-width:0;margin-bottom:20px}

  .stat strong{font-size:36px}
  .quick-grid{grid-template-columns:1fr;gap:9px}

  .upload-box,.video-upload,.form-card{width:100%;min-width:0;padding:14px;border-radius:13px}
  .upload-box label{min-height:120px;padding:16px}
  .preview-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .preview-grid img{height:110px}

  .media-grid{grid-template-columns:1fr;gap:10px}
  .media-image img{height:auto;aspect-ratio:4/3}

  .media h3{font-size:25px}
  .actions{flex-wrap:wrap}

  .video-upload{grid-template-columns:1fr;gap:10px;margin:14px 0 18px}

  .video-admin-info{padding:12px}
  .video-admin-heading{align-items:flex-start}
  .video-admin-heading h2{font-size:24px;overflow-wrap:anywhere}

  .form-grid{grid-template-columns:1fr;gap:11px}
  .form-grid .full,.form-actions{grid-column:auto}
  .form-grid input,.form-grid textarea,.form-grid select{width:100%;min-width:0;max-width:100%}
  .form-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .form-actions button{width:100%;min-width:0}

  .table{width:100%;min-width:0;overflow:hidden}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:13px 12px;min-width:0}
  .row>*{min-width:0;overflow-wrap:anywhere}
  .row>*:nth-child(2){display:none}
  .row>*:nth-child(3){grid-column:2;grid-row:1;align-self:center}
  .row .actions{justify-content:flex-end;max-width:130px}
  .row .actions button{font-size:9px;padding:7px 8px}
  .row.head{display:none}

  .photo-upload .photo-queue-card{grid-template-columns:1fr;gap:14px;padding:12px}
  .photo-upload .photo-crop-column{width:100%;min-width:0}
  .photo-upload .crop-window{width:100%;max-width:100%;min-height:0;aspect-ratio:4/3}
  .photo-upload .photo-queue-fields{grid-template-columns:1fr;gap:10px}
  .photo-queue-title,.photo-title-field,.photo-description-field,.crop-controls{grid-column:auto}
  .photo-queue-title{grid-template-columns:1fr;align-items:start}
  .photo-queue-title .text-danger{justify-self:start}
  .photo-queue-row{grid-template-columns:1fr}
  .crop-controls{grid-template-columns:1fr;gap:8px}
  .stay-dates{grid-template-columns:1fr 1fr}

  .video-queue-card{grid-template-columns:1fr;gap:10px;padding:10px}
  .video-queue-card>video{max-height:none;width:100%}
  .video-queue-fields{min-width:0}

  .admin-dialog{width:calc(100vw - 24px);max-width:none;max-height:calc(100vh - 24px);padding:20px;border-radius:17px}
  .admin-dialog h2{font-size:31px}
  .admin-dialog-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .admin-dialog-actions button{width:100%;min-width:0}
}

@media (max-width: 430px){
  .view{padding-left:11px;padding-right:11px}
  .mobile-head{padding:0 10px}
  .mobile-head a{font-size:9px}
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:13px}
  .stat strong{font-size:31px}
  .stat span{font-size:9px}
  .preview-grid,.video-preview-grid{grid-template-columns:1fr 1fr}
  .form-actions,.admin-dialog-actions{grid-template-columns:1fr}
  .stay-dates{grid-template-columns:1fr}
}
